# Builds this Cog model on GitHub's computers and pushes it to Replicate.
# Run it by hand: repository page -> Actions -> "Push to Replicate" -> Run workflow.
# Needs the repository secret REPLICATE_CLI_AUTH_TOKEN (your Replicate API token).
#
# Replicate's guide uses the actions replicate/setup-cog and jlumbroso/free-disk-space; the first no
# longer exists on GitHub and the second has moved (checked 2026-11-21), so their steps are done
# here with plain commands instead.

name: Push to Replicate

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Replicate model, like "username/model-name"'
        required: true
        default: "htunarkar/se_model_v2_1"

jobs:
  push_to_replicate:
    name: Push to Replicate
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h / /mnt

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cog
        env:
          COG_VERSION: v0.23.1
        run: |
          sudo curl -fsSL -o /usr/local/bin/cog \
            "https://github.com/replicate/cog/releases/download/${COG_VERSION}/cog_Linux_x86_64"
          sudo chmod +x /usr/local/bin/cog
          cog --version

      - name: Log in to Replicate
        env:
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
        run: echo "$REPLICATE_TOKEN" | cog login --token-stdin

      - name: Push to Replicate
        run: cog push "r8.im/${{ inputs.model_name }}"
